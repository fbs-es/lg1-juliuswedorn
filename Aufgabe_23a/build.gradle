plugins {
    id 'java'
    id 'maven-publish'
}

description = 'Aufgabe 23a'
group = 'at.just-better-services'
version = '26.0.1'

repositories {
    mavenCentral()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'aufgabe-23a'
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/julius16869/lg1-juliuswedorn-packages")
            credentials {
                username = gprUser
                password = gprKey
            }
        }
    }
}